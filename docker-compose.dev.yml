services:
  mongodb:
    image: mongo:6.0
    container_name: quadtree_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - quadtree_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quadtree_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=multimedia_provenance
      - UPLOAD_DIR=/app/uploads
      - DEFAULT_QUADTREE_DEPTH=3
      - REJECTION_THRESHOLD=15
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - quadtree_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quadtree_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - quadtree_net

volumes:
  mongodb_data:
  backend_uploads:

networks:
  quadtree_net:
    driver: bridge
